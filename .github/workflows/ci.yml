name: CI

"on":
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Phase 0 skeleton: api / web / purity only. `migrations` (Alembic drift
# check) and `docker` (image builds) land in Phase 1 alongside the schema
# and Dockerfiles they depend on; Playwright e2e lands in the `web` job
# once Phase 5/6 gives it something to click.
jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict services/api/src/ax/core
      - run: uv run mypy services/api/src/ax
      - run: uv run pytest

  purity:
    name: purity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      # Enforced separately from the rest of the api job because
      # CLAUDE.md rule 3 (ax.core stays pure) must never quietly ride
      # along with — or get skipped by — other test failures.
      - run: uv run pytest services/api/tests/test_core_purity.py -v

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      - run: pnpm --filter web exec tsc --noEmit
      - run: pnpm --filter web build
