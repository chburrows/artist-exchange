[project]
name = "ax"
version = "0.1.0"
description = "Artist Exchange API"
requires-python = ">=3.12"
# Runtime deps (fastapi, sqlalchemy, alembic, ...) land in Phase 1 alongside
# the code that needs them.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ax"]
