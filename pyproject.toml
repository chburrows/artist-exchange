[project]
name = "artist-exchange"
version = "0.0.0"
requires-python = ">=3.12"
# Pulls the real project in so a plain `uv sync` / `uv run` at the repo
# root is enough — nobody has to `cd services/api` first.
dependencies = ["ax"]

[tool.uv.sources]
ax = { workspace = true }

# Shared dev toolchain. Declared here (not in services/api/pyproject.toml)
# because uv installs the "dev" group by default on `uv sync`, which is
# what makes the root-level ergonomics above actually work.
[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.110",
]

# Virtual workspace root: not a package itself, just ties services/api into
# a single `uv sync` / `uv run` surface from the repo root.
[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/api"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# `ax` is installed into the venv as a workspace member, so isort would
# otherwise sort it with third-party packages and scatter our own imports
# among fastapi/sqlalchemy.
known-first-party = ["ax", "tests"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# CI runs `mypy --strict` scoped to services/api/src/ax/core specifically
# (CLAUDE.md rule 3) and this looser default elsewhere. Strictness is a
# CLI flag, not a config split, so it stays correct as files move between
# packages.

[tool.pytest.ini_options]
testpaths = ["services/api/tests"]

[tool.coverage.run]
source = ["ax.core"]
