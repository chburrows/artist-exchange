[alembic]
# Lives at the repo root, not in services/api, so `uv run alembic upgrade
# head` works from the root the way CLAUDE.md documents it. The container
# gets the same file because the Docker build context is also the repo
# root — one config, no drift between dev and production.
script_location = services/api/migrations
prepend_sys_path = services/api/src
path_separator = os

# sqlalchemy.url is intentionally absent: migrations/env.py reads
# DATABASE_URL through ax.settings, so local, CI, and Railway all use the
# same resolution path and there is no second place for the URL to drift.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
