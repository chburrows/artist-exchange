name: CI

"on":
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Playwright e2e joins the `web` job once Phase 5/6 gives it something to
# click.
jobs:
  api:
    name: api
    runs-on: ubuntu-latest

    # Integration tests run against a real Postgres, not SQLite. The
    # schema uses citext, JSONB, and ON CONFLICT, so a substitute database
    # would test something the product never runs on.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: artist_exchange
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict services/api/src/ax/core
      - run: uv run mypy services/api/src/ax
      - run: uv run pytest --cov
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/artist_exchange
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/artist_exchange_test

  migrations:
    name: migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: artist_exchange
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/artist_exchange

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - run: uv sync --locked

      - name: Apply migrations to a clean database
        run: uv run alembic upgrade head

      # The highest-value check in this workflow. Models drifting from
      # migrations is the most common source of "works locally, breaks in
      # production" in a SQLAlchemy repo, and it is invisible until a
      # deploy fails.
      - name: Fail if models have drifted from migrations
        run: uv run alembic check

      # A migration that cannot be undone is a migration you cannot deploy
      # confidently. Checked now, while there is one revision, rather than
      # discovering it during an incident.
      - name: Verify the chain is reversible
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

  purity:
    name: purity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      # Enforced separately from the rest of the api job because
      # CLAUDE.md rule 3 (ax.core stays pure) must never quietly ride
      # along with — or get skipped by — other test failures.
      - run: uv run pytest services/api/tests/test_core_purity.py -v

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      # Built here so a Railway deploy is never the first time the image
      # gets built. A Dockerfile that only breaks in production is a
      # deploy-time outage for something CI could have caught in a minute.
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: false
          load: true
          tags: artist-exchange-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the image actually starts and serves traffic. A build that
      # succeeds but exits on boot looks green without this.
      - name: Smoke-test the image
        run: |
          set -euo pipefail
          docker run -d --name api -p 8000:8000 \
            -e DATABASE_URL=postgresql+psycopg://unused:unused@localhost:5432/unused \
            -e INTERNAL_JOB_TOKEN=ci-token \
            artist-exchange-api:ci

          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo
              echo "Image serves /health."
              exit 0
            fi
            sleep 1
          done

          echo "Container never became healthy. Logs:"
          docker logs api
          exit 1

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      - run: pnpm --filter web exec tsc --noEmit
      - run: pnpm --filter web build
